[package]
name = "rtriage-cli"
description = "Fast static malware triage for PE and ELF binaries; never executes what it analyzes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "rtriage"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
rtriage-core = { path = "../rtriage-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
# YARA scanning (rtriage-core/yara). Off in plain builds, on in release binaries.
yara = ["rtriage-core/yara"]
# Deterministic worker misbehaviour (crash / hang / oversized output) for the
# isolation tests. Never enable in release builds.
test-hooks = []

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
rtriage-fixtures = { path = "../rtriage-fixtures" }
