[package]
name = "rtriage-core"
description = "Static malware triage library for PE and ELF binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe32", "pe64", "elf32", "elf64", "endian_fd"] }
md-5 = "0.11.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
toml = "1.2.3"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
rtriage-fixtures = { path = "../rtriage-fixtures" }
serde_json = "1.0.154"
