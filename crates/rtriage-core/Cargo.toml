[package]
name = "rtriage-core"
description = "Static malware triage library for PE and ELF binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe32", "pe64", "elf32", "elf64", "endian_fd"] }
md-5 = "0.11.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
toml = "1.2.3"
yara-x = { version = "1.24.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "pe-module", "elf-module", "hash-module", "math-module", "string-module", "time-module"], optional = true }

[features]
# YARA scanning through yara-x (pure Rust; compiles rules to WebAssembly
# with wasmtime). Off by default: it adds a large dependency tree.
yara = ["dep:yara-x"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
rtriage-fixtures = { path = "../rtriage-fixtures" }
serde_json = "1.0.154"
