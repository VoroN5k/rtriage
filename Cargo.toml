[workspace]
resolver = "2"
members = ["crates/rtriage-core", "crates/rtriage-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Hostile-input hygiene; test code opts out locally with #[allow(...)].
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
