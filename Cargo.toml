[workspace]
resolver = "2"
members = ["crates/rtriage-core", "crates/rtriage-cli", "crates/rtriage-fixtures", "crates/rtriage-sanitize", "crates/rtriage-tui"]
# cargo-fuzz targets build separately with nightly (see fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Hostile-input hygiene; test code opts out locally with #[allow(...)].
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
