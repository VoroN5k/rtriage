name: Fuzz

# Long fuzzing runs are not part of every push: weekly, and on demand.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: pe_parse, seeds: pe }
          - { target: elf_parse, seeds: elf }
          - { target: strings, seeds: all }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Seed corpus: synthetic fixtures only (never real samples).
      - run: cargo run --locked -p rtriage-fixtures --example fuzz_corpus -- fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }}
      - name: Run ${{ matrix.target }}
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=${{ github.event.inputs.seconds || '600' }}
          -timeout=30 -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
