# rtriage packer and runtime explanations ("explained-by").
#
# When a packer or runtime is CONFIRMED, the findings it necessarily causes
# are marked as explained by it: they stay in the report, but contribute no
# points and consume no category cap. `--explain` lists every suppression.
# API behavior groups (PE-API-*, ELF-API-*) can never be explained.
#
# [[packer]]
#   format        "pe" (default) or "elf"
#   confirm_with  indicators that must ALL be present (at least two, so a
#                 single spoofed artefact never suppresses anything); only
#                 indicators rtriage can check for that packer are allowed:
#                   PE : section_names, header_signature, stub_structure
#                   ELF: header_signature, info_banner, stub_structure
#   explains      structural finding IDs the packer explains
#
# [[runtime]]
#   confirm_min   independent runtime indicators required (at least two)
#   explains      only small hardening/import findings its toolchain produces
#                 by design (ELF-HARDENING-NO-PIE, ELF-HARDENING-NO-RELRO,
#                 PE-IMPORTS-FEW)
#
# Detection lives in the analyzers; this file only says what a confirmed
# packer or runtime explains. See docs/heuristics.md.

schema_version = 1

[[packer]]
name = "UPX"
format = "pe"
confirm_with = ["section_names", "header_signature", "stub_structure"]
explains = [
    "PE-SECTION-RWX",            # UPX0/UPX1 are RWX by design
    "PE-SECTION-VIRTUAL-ONLY",   # UPX0 is the decompression target
    "PE-SECTION-HIGH-ENTROPY",   # UPX1 holds compressed code
    "PE-SECTION-NAME-UNUSUAL",   # UPX0/UPX1
    "PE-ENTRYPOINT-UNUSUAL",     # entry point is the decompressor stub in UPX1
    "PE-IMPORTS-DYNAMIC-RESOLUTION", # stub rebuilds the import table itself
    "PE-IMPORTS-FEW",            # minimal stub import set
    "PE-RESOURCE-HIGH-ENTROPY",  # UPX compresses resources too
]

[[packer]]
name = "UPX"
format = "elf"
confirm_with = ["header_signature", "info_banner", "stub_structure"]
explains = [
    "ELF-SECTIONS-MISSING",      # UPX output has no section header table
    "ELF-SEGMENT-RWX",           # the stub unpacks in place
    "ELF-SEGMENT-HIGH-ENTROPY",  # compressed program
    "ELF-PACKED-LIKELY",         # same shape, now with a name
    "ELF-HARDENING-NO-PIE",      # the stub is ET_EXEC whatever the original was
    "ELF-HARDENING-NO-RELRO",    # the stub has no PT_GNU_RELRO; says nothing about the original
    # ELF-HARDENING-EXEC-STACK: not until verified on a real UPX-packed hello
]

[[runtime]]
name = "go"
confirm_min = 2
explains = [
    "ELF-HARDENING-NO-PIE",      # Go links non-PIE static executables by default
    "ELF-HARDENING-NO-RELRO",
    "PE-IMPORTS-FEW",
]

[[runtime]]
name = "rust"
confirm_min = 2
explains = [
    "ELF-HARDENING-NO-PIE",      # e.g. non-PIE static musl builds
    "ELF-HARDENING-NO-RELRO",
    "PE-IMPORTS-FEW",
]
